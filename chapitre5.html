<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB Chapitre 5 - Examen Blanc</title>
<style>
:root {
  --bg:#eef2f7; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --blue:#2563eb;
  --blue2:#1d4ed8; --green:#16a34a; --red:#dc2626; --border:#dbe3ef;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
.header { background:#1e293b; color:white; padding:18px 24px; box-shadow:0 2px 10px rgba(0,0,0,.18); position:sticky; top:0; z-index:99; }
.header-inner { max-width:980px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:14px; }
h1 { margin:0; font-size:24px; }
.timer { font-size:24px; font-weight:bold; color:#facc15; background:#0f172a; padding:10px 16px; border-radius:10px; min-width:110px; text-align:center; }
.container { max-width:980px; margin:24px auto; padding:0 18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 24px rgba(15,23,42,.08); padding:24px; }
.meta { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.badge { background:#dbeafe; color:#1e40af; padding:7px 10px; border-radius:999px; font-size:13px; font-weight:bold; }
.progress-wrap { background:#e5e7eb; height:12px; border-radius:999px; overflow:hidden; margin:14px 0 22px; }
.progress { height:100%; background:var(--blue); width:0%; transition:.25s; }
.qtop { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; color:var(--muted); }
.qtype { font-weight:bold; color:#475569; }
.question-title { font-size:20px; font-weight:bold; margin:16px 0 20px; line-height:1.45; }
.option { display:flex; gap:12px; align-items:flex-start; padding:14px; margin:11px 0; border:2px solid #e5e7eb; border-radius:12px; cursor:pointer; background:#f9fafb; transition:.15s; }
.option:hover { border-color:#93c5fd; background:#eff6ff; }
.option input { margin-top:2px; transform:scale(1.2); }
.option.selected { border-color:var(--blue); background:#eff6ff; }
.nav { display:flex; justify-content:space-between; gap:12px; margin-top:24px; }
button { border:0; border-radius:10px; padding:13px 18px; font-weight:bold; font-size:15px; cursor:pointer; }
button:disabled { opacity:.45; cursor:not-allowed; }
.prev { background:#e5e7eb; color:#374151; }
.next { background:var(--blue); color:white; }
.next:hover { background:var(--blue2); }
.submit { background:var(--green); color:white; }
.grid { display:grid; grid-template-columns:repeat(10,1fr); gap:8px; margin-top:18px; }
.jump { padding:9px 0; border-radius:8px; background:#e5e7eb; color:#374151; font-size:13px; }
.jump.current { background:var(--blue); color:white; }
.jump.answered { background:#bbf7d0; color:#166534; }
.result { display:none; }
.score { font-size:48px; font-weight:900; margin:10px 0; }
.pass { color:var(--green); } .fail { color:var(--red); }
.review { border-left:5px solid #94a3b8; background:#f8fafc; padding:14px; border-radius:10px; margin:12px 0; }
.review.ok { border-left-color:var(--green); }
.review.ko { border-left-color:var(--red); }
.small { color:var(--muted); font-size:14px; }
.warning { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:12px; border-radius:12px; margin:12px 0; }
@media(max-width:700px) {
  .header-inner { flex-direction:column; align-items:flex-start; }
  .grid { grid-template-columns:repeat(5,1fr); }
  .nav { flex-direction:column; }
}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div>
      <h1>ISTQB Fondation v4.0 — Chapitre 5</h1>
      <div class="small" style="color:#cbd5e1">Mode examen : 40 questions difficiles, gestion, risques, estimation, défauts — 45 min</div>
    </div>
    <div class="timer" id="timer">45:00</div>
  </div>
</div>

<div class="container">
  <div id="exam" class="card">
    <div class="meta">
      <span class="badge">40 questions</span>
      <span class="badge">45 minutes</span>
      <span class="badge">Seuil 65%</span>
      <span class="badge">Réponses variées</span>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="qtop">
      <span id="qcount"></span>
      <span class="qtype" id="qtype"></span>
    </div>
    <div class="question-title" id="question"></div>
    <div id="options"></div>
    <div class="nav">
      <button class="prev" id="prevBtn" onclick="prevQuestion()">← Précédent</button>
      <button class="next" id="nextBtn" onclick="nextQuestion()">Suivant →</button>
      <button class="submit" id="submitBtn" onclick="submitExam()" style="display:none">Valider l’examen</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="result" class="card result"></div>
</div>

<script>
const questions = [{"q": "Quel est l’objectif principal d’un plan de test ?", "type": "single", "opts": ["Lister uniquement les défauts trouvés", "Remplacer la stratégie de test organisationnelle sans explication", "Garantir que tous les défauts seront détectés", "Décrire les objectifs, ressources, processus, calendrier et approche du projet de test"], "ans": [3], "exp": "Un plan de test décrit objectifs, ressources, processus, moyens, calendrier, approche et communication pour atteindre les objectifs de test."}, {"q": "Quels éléments font typiquement partie du contenu d’un plan de test ?", "type": "multi", "opts": ["Référentiel des risques", "Le code source complet de l’application", "Contexte du test, périmètre, objectifs et contraintes", "Approche de test, critères d’entrée/sortie, métriques"], "ans": [0, 2, 3], "exp": "Le plan contient contexte, hypothèses, parties prenantes, communication, risques, approche, budget et calendrier. Le code source complet n’est pas un contenu typique du plan."}, {"q": "Dans une planification de release Agile, quelle contribution du testeur est correcte ?", "type": "single", "opts": ["Ignorer les risques qualité jusqu’à l’itération", "Écrire uniquement les scripts après la mise en production", "Participer à la rédaction de User Stories testables et critères d’acceptation", "Décider seul de la valeur métier"], "ans": [2], "exp": "En planification de release, le testeur participe aux User Stories testables, critères d’acceptation, analyse des risques, estimation de l’effort et approche de test."}, {"q": "Dans une planification d’itération, que fait typiquement un testeur ?", "type": "single", "opts": ["Analyse détaillée des risques des User Stories et estimation des tâches de test", "Définit uniquement le budget annuel de l’entreprise", "Archive le testware de toutes les releases futures", "Supprime les critères d’acceptation"], "ans": [0], "exp": "En planification d’itération, les testeurs analysent les risques détaillés, testabilité, tâches de test, effort et aspects fonctionnels/non fonctionnels."}, {"q": "Quelle affirmation distingue correctement critères d’entrée et critères de sortie ?", "type": "single", "opts": ["Entrée = préconditions pour démarrer ; sortie = conditions pour déclarer l’activité achevée", "Entrée = défauts ouverts ; sortie = ressources disponibles", "Entrée et sortie sont synonymes", "Sortie = uniquement budget restant"], "ans": [0], "exp": "Les critères d’entrée définissent les préconditions ; les critères de sortie définissent ce qui doit être atteint pour terminer."}, {"q": "Lequel est un critère d’entrée typique ?", "type": "single", "opts": ["Disponibilité de l’environnement, données de test et base de test", "Tous les tests planifiés exécutés", "Rapport de clôture validé", "Tous les défauts signalés"], "ans": [0], "exp": "Les ressources, environnements, données, budget, temps et base de test disponibles sont des critères d’entrée typiques."}, {"q": "Lequel est un critère de sortie typique ?", "type": "single", "opts": ["Aucun cas de test écrit", "Exigences non disponibles", "Environnement indisponible", "Niveau de couverture atteint et défauts critiques résolus ou acceptés"], "ans": [3], "exp": "Les critères de sortie peuvent inclure couverture atteinte, défauts non résolus sous seuil, tests planifiés exécutés, défauts signalés."}, {"q": "En Agile, comment appelle-t-on souvent les critères de sortie pour un livrable ?", "type": "single", "opts": ["Definition of Ready", "Product Backlog", "Smoke Test", "Definition of Done"], "ans": [3], "exp": "En Agile, les critères de sortie sont souvent appelés Definition of Done. Les critères d’entrée d’une User Story sont souvent la Definition of Ready."}, {"q": "Une User Story ne peut pas démarrer car ses critères d’acceptation sont ambigus et les données métier manquent. Quel concept est surtout concerné ?", "type": "single", "opts": ["Rapport de clôture", "Critère de sortie déjà satisfait", "Definition of Ready / critères d’entrée", "Gestion de configuration uniquement"], "ans": [2], "exp": "Les préconditions nécessaires au démarrage relèvent des critères d’entrée ou Definition of Ready."}, {"q": "Estimation basée sur des ratios : un projet précédent avait un ratio développement:test de 3:2. Le nouveau projet est estimé à 900 jours de développement. Quel effort de test est estimé ?", "type": "single", "opts": ["450 jours", "600 jours", "300 jours", "900 jours"], "ans": [1], "exp": "Ratio dev:test = 3:2. Si développement = 900, test = 900 × 2/3 = 600 jours."}, {"q": "Estimation en trois points : a=8, m=14, b=32. Quelle est l’estimation E avec E=(a+4m+b)/6 ?", "type": "single", "opts": ["16", "18", "14", "20"], "ans": [0], "exp": "E=(8+4×14+32)/6=(8+56+32)/6=96/6=16."}, {"q": "Avec a=8 et b=32, quelle est l’erreur de mesure SD=(b-a)/6 ?", "type": "single", "opts": ["4", "2", "6", "3"], "ans": [0], "exp": "SD=(32-8)/6=24/6=4."}, {"q": "Quelle technique d’estimation convient particulièrement aux cycles itératifs en utilisant les données des dernières itérations ?", "type": "single", "opts": ["Pyramide des tests", "Extrapolation", "Table de décision", "Analyse statique"], "ans": [1], "exp": "L’extrapolation utilise les mesures du projet en cours, par exemple la moyenne des dernières itérations."}, {"q": "Quelle technique d’estimation est basée sur des experts estimant séparément puis convergeant vers un consensus ?", "type": "single", "opts": ["Analyse des risques produit", "Couverture additionnelle", "Estimation basée sur ratios", "Delphi large bande"], "ans": [3], "exp": "Delphi large bande est une technique itérative basée sur l’expertise, avec estimations isolées, discussion et convergence."}, {"q": "Dans le planning poker, les cartes représentent généralement :", "type": "single", "opts": ["La sévérité des risques uniquement", "L’ampleur de l’effort", "La priorité des défauts uniquement", "Le nombre de branches du code"], "ans": [1], "exp": "Le planning poker est une variante Agile du Delphi large bande, avec cartes représentant l’effort."}, {"q": "Priorisation basée sur les risques : quel test doit être exécuté en premier ?", "type": "single", "opts": ["Celui écrit en dernier", "Celui couvrant le risque le plus important", "Celui qui couvre une exigence mineure", "Celui qui est le plus court"], "ans": [1], "exp": "En priorisation basée sur les risques, les tests associés aux risques les plus élevés sont exécutés en premier."}, {"q": "Priorisation par couverture additionnelle : après avoir choisi le test couvrant le plus d’éléments, le test suivant devrait être celui qui :", "type": "single", "opts": ["Est lié à l’exigence la moins prioritaire", "N’a aucune dépendance uniquement", "Ajoute le plus de couverture non encore couverte", "Répète exactement la même couverture"], "ans": [2], "exp": "La variante additionnelle sélectionne ensuite le cas apportant le plus de couverture nouvelle."}, {"q": "Un test prioritaire dépend d’un test moins prioritaire pour créer les données nécessaires. Quel ordre est correct ?", "type": "single", "opts": ["Supprimer le test prioritaire", "Exécuter d’abord le test moins prioritaire dont dépend le test prioritaire", "Exécuter toujours selon la priorité pure", "Ignorer la dépendance"], "ans": [1], "exp": "Les dépendances peuvent imposer d’exécuter un test moins prioritaire avant un test plus prioritaire."}, {"q": "Dans la pyramide des tests, plus on monte dans les couches, plus les tests sont généralement :", "type": "single", "opts": ["Plus petits, plus rapides, plus isolés", "Moins détaillés, moins isolés, plus lents", "Toujours plus nombreux", "Uniquement unitaires"], "ans": [1], "exp": "Les tests de haut niveau sont souvent plus lents, moins isolés et couvrent plusieurs fonctionnalités."}, {"q": "Dans la pyramide des tests, la couche basse contient typiquement :", "type": "single", "opts": ["Uniquement des tests UAT manuels", "Beaucoup de tests petits, rapides et isolés", "Peu de tests bout en bout très lents", "Des tests exploratoires non guidés uniquement"], "ans": [1], "exp": "La base de la pyramide contient beaucoup de tests unitaires/composants rapides et isolés."}, {"q": "Dans les quadrants de test Agile, Q1 correspond à :", "type": "single", "opts": ["Orienté métier, critique produit : UAT et utilisabilité", "Orienté technologie, soutien à l’équipe : composants et intégration de composants", "Orienté technologie, critique produit : non fonctionnel", "Orienté métier, soutien équipe : exemples et User Stories"], "ans": [1], "exp": "Q1 est orienté technologie et soutient l’équipe, avec tests de composants et intégration de composants, souvent automatisés."}, {"q": "Dans les quadrants de test Agile, Q2 contient typiquement :", "type": "single", "opts": ["Tests de composants uniquement", "Tests non fonctionnels sauf utilisabilité", "Tests fonctionnels, exemples, tests de User Story, API, simulations", "Tests exploratoires et UAT uniquement"], "ans": [2], "exp": "Q2 est orienté métier et soutien à l’équipe : critères d’acceptation, exemples, User Stories, prototypes, API."}, {"q": "Dans les quadrants de test Agile, Q3 contient typiquement :", "type": "single", "opts": ["Tests exploratoires, utilisabilité et acceptation utilisateurs", "Tests unitaires isolés", "Tests de composants CI uniquement", "Smoke tests et performance uniquement"], "ans": [0], "exp": "Q3 est orienté métier et critique du produit, souvent manuel et orienté utilisateur."}, {"q": "Dans les quadrants de test Agile, Q4 contient typiquement :", "type": "single", "opts": ["Tests de composants uniquement", "Critères d’acceptation Given/When/Then uniquement", "Smoke tests et tests non fonctionnels sauf utilisabilité", "Tests de User Story uniquement"], "ans": [2], "exp": "Q4 est orienté technologie et critique du produit : smoke tests et non fonctionnels, souvent automatisés."}, {"q": "Comment calcule-t-on le niveau de risque dans une approche quantitative simple ?", "type": "single", "opts": ["Probabilité × Impact", "Impact / nombre de défauts corrigés", "Probabilité + nombre de testeurs", "Couverture × vélocité"], "ans": [0], "exp": "Dans l’approche quantitative, niveau de risque = probabilité × impact."}, {"q": "Un risque a une probabilité de 0,4 et un impact évalué à 9. Quel est son niveau de risque quantitatif ?", "type": "single", "opts": ["22,5", "9,4", "3,6", "2,25"], "ans": [2], "exp": "0,4 × 9 = 3,6."}, {"q": "Quel exemple est un risque projet ?", "type": "single", "opts": ["Vulnérabilité de sécurité dans l’application", "Temps de réponse trop lent en production", "Manque de personnel qualifié pour automatiser les tests", "Calcul de TVA incorrect"], "ans": [2], "exp": "Un risque projet affecte la gestion du projet : ressources, compétences, planning, budget, fournisseurs."}, {"q": "Quel exemple est un risque produit ?", "type": "single", "opts": ["Fonctionnalité critique de paiement incorrecte", "Conflit entre équipes", "Faillite d’un fournisseur", "Retard de livraison de l’environnement de test"], "ans": [0], "exp": "Un risque produit est lié aux caractéristiques qualité du produit : fonctionnalités, performance, sécurité, UX, etc."}, {"q": "Quels éléments sont des risques produit ?", "type": "multi", "opts": ["Mauvaise expérience utilisateur", "Vulnérabilité de sécurité", "Algorithme inefficace", "Estimation projet inexacte"], "ans": [0, 1, 2], "exp": "La mauvaise estimation est un risque projet ; les autres concernent la qualité du produit."}, {"q": "Quels éléments sont des risques projet ?", "type": "multi", "opts": ["Réductions de coûts", "Calcul métier incorrect", "Compétences insuffisantes", "Défaillance de livraison d’un tiers"], "ans": [0, 2, 3], "exp": "Le calcul métier incorrect est un risque produit ; les autres affectent la gestion du projet."}, {"q": "Quel est l’objectif principal de l’analyse des risques produit du point de vue du test ?", "type": "single", "opts": ["Concentrer l’effort de test pour minimiser le risque résiduel produit", "Garantir que la livraison ne sera jamais retardée", "Remplacer toutes les estimations", "Éliminer tous les risques projet"], "ans": [0], "exp": "L’analyse des risques produit permet de focaliser l’effort de test afin de réduire le risque résiduel."}, {"q": "Quelles activités composent l’analyse des risques ?", "type": "single", "opts": ["Atténuation uniquement", "Identification des risques et évaluation des risques", "Clôture des défauts uniquement", "Pilotage uniquement"], "ans": [1], "exp": "L’analyse des risques comprend l’identification et l’évaluation des risques."}, {"q": "Quelles activités composent le contrôle des risques ?", "type": "single", "opts": ["Rédaction du plan de test uniquement", "Priorisation des exigences uniquement", "Identification et évaluation uniquement", "Atténuation des risques et pilotage/surveillance des risques"], "ans": [3], "exp": "Le contrôle des risques comprend l’atténuation et la surveillance/pilotage des risques."}, {"q": "Après analyse des risques produit, quelle action est pertinente ?", "type": "single", "opts": ["Choisir des techniques et niveaux de couverture plus rigoureux pour les risques élevés", "Éviter les tests non fonctionnels", "Tester tout avec le même effort", "Réduire l’indépendance même pour les systèmes critiques"], "ans": [0], "exp": "Les risques élevés influencent rigueur, périmètre, techniques, niveaux, couverture, effort et priorité des tests."}, {"q": "Quelles réponses possibles à un risque produit sont citées ?", "type": "multi", "opts": ["Atténuation par des tests", "Acceptation du risque", "Ignorer sans décision ni suivi", "Transfert du risque"], "ans": [0, 1, 3], "exp": "Les options incluent atténuer, accepter, transférer ou prévoir un plan d’urgence. Ignorer sans décision n’est pas une réponse maîtrisée."}, {"q": "Quelle action atténue un risque produit par les tests ?", "type": "single", "opts": ["Appliquer des types de tests adaptés aux caractéristiques qualité concernées", "Supprimer les revues", "Ne tester que les fonctionnalités faciles", "Baisser la couverture des zones critiques"], "ans": [0], "exp": "Les actions d’atténuation incluent testeurs compétents, indépendance adaptée, revues, analyse statique, techniques/couverture appropriées, tests dynamiques et régression."}, {"q": "Le pilotage des tests consiste principalement à :", "type": "single", "opts": ["Créer uniquement le plan initial", "Collecter des informations pour évaluer l’avancement et les critères de sortie", "Corriger les défauts", "Modifier le planning sans métriques"], "ans": [1], "exp": "Le pilotage collecte les informations de test pour évaluer l’avancement et le respect des critères."}, {"q": "Le contrôle des tests consiste principalement à :", "type": "single", "opts": ["Archiver uniquement le testware", "Utiliser les informations de pilotage pour guider et corriger les actions de test", "Déployer en production", "Écrire des User Stories"], "ans": [1], "exp": "Le contrôle utilise les informations issues du pilotage pour prendre des actions correctives."}, {"q": "Quel exemple est une directive de contrôle des tests ?", "type": "single", "opts": ["Ajuster le calendrier après un retard de l’environnement de test", "Ignorer un risque devenu problème", "Créer une nouvelle marque commerciale", "Supprimer le rapport de défaut"], "ans": [0], "exp": "Les directives de contrôle incluent reprioriser, réévaluer critères, ajuster planning, ajouter ressources."}, {"q": "Quels éléments sont des métriques de test courantes ?", "type": "multi", "opts": ["Couverture des exigences ou du code", "Couleur préférée des testeurs", "Nombre et priorités des défauts trouvés/corrigés", "Nombre de cas exécutés/réussis/échoués"], "ans": [0, 2, 3], "exp": "Les métriques incluent avancement, qualité produit, défauts, risques, couverture, coût."}, {"q": "Quel contenu appartient typiquement à un rapport d’avancement des tests ?", "type": "multi", "opts": ["Leçons apprises finales uniquement après clôture", "Écarts notables par rapport au calendrier", "Risques nouveaux ou modifiés", "Période de test"], "ans": [1, 2, 3], "exp": "Le rapport d’avancement inclut période, progression, obstacles, métriques, risques nouveaux/modifiés, tests planifiés."}, {"q": "Quel contenu appartient typiquement à un rapport de clôture des tests ?", "type": "multi", "opts": ["Risques non atténués et défauts non corrigés", "Résumé du test", "Planning détaillé des tests à écrire avant le projet", "Évaluation de la qualité par rapport au plan initial"], "ans": [0, 1, 3], "exp": "Le rapport de clôture résume l’étape, écarts, obstacles, métriques, risques non atténués, défauts ouverts et leçons apprises."}, {"q": "Pour une équipe distribuée avec décalage horaire, quel mode de communication peut être plus approprié ?", "type": "single", "opts": ["Aucune communication", "Uniquement discussions de couloir", "Communication plus formelle, documentation en ligne ou rapports structurés", "Seulement tableau blanc physique"], "ans": [2], "exp": "La communication doit s’adapter au contexte ; les équipes distribuées peuvent nécessiter plus de formalisme."}, {"q": "Quel est le rôle de la gestion de configuration pour le test ?", "type": "single", "opts": ["Remplacer l’analyse des risques", "Identifier, contrôler, versionner et tracer les éléments de test et leurs relations", "Décider de la sévérité métier", "Choisir le design graphique de l’application"], "ans": [1], "exp": "La gestion de configuration identifie, contrôle et suit plans, cas, scripts, résultats, logs, rapports et objets de test."}, {"q": "Pourquoi une base de référence est-elle utile en test ?", "type": "single", "opts": ["Elle interdit toute correction de défaut", "Elle remplace les environnements de test", "Elle supprime la nécessité de versionner", "Elle permet de contrôler les modifications et de reproduire des résultats de tests précédents"], "ans": [3], "exp": "Une baseline approuvée ne change que via contrôle formel, et permet de revenir à une version antérieure."}, {"q": "Quels éléments doivent être gérés comme éléments de configuration dans le test ?", "type": "multi", "opts": ["Cas de test et scripts de test", "Résultats et logs de test", "Rapports de test", "Opinions non documentées dans un couloir"], "ans": [0, 1, 2], "exp": "Les produits d’activités de test doivent être identifiés, versionnés, suivis et liés pour maintenir la traçabilité."}, {"q": "Quel est un objectif d’un rapport de défaut ?", "type": "single", "opts": ["Garantir que le défaut sera corrigé immédiatement", "Fournir assez d’informations pour résoudre le problème et suivre la qualité", "Remplacer les tests de confirmation", "Blâmer la personne ayant codé"], "ans": [1], "exp": "Le rapport de défaut fournit les informations nécessaires à la résolution, au suivi qualité et à l’amélioration des processus."}, {"q": "Quel élément est essentiel dans un rapport de défaut dynamique ?", "type": "single", "opts": ["Étapes de reproduction, résultat attendu et résultat réel", "Suppression du contexte", "Nom du coupable supposé", "Opinion personnelle non vérifiée"], "ans": [0], "exp": "Un rapport utile contient description reproductible, contexte, attendu/réel, environnement, objet de test, pièces jointes, etc."}, {"q": "Quelle différence entre sévérité et priorité est correcte ?", "type": "single", "opts": ["Priorité n’existe pas dans un rapport de défaut", "Les deux sont toujours identiques", "Sévérité = ordre de correction ; priorité = impact technique uniquement", "Sévérité = impact du défaut ; priorité = urgence/ordre de correction"], "ans": [3], "exp": "La sévérité représente l’impact ; la priorité représente l’importance/urgence de correction."}, {"q": "Une anomalie signalée peut finalement être :", "type": "multi", "opts": ["Un vrai défaut", "Un faux positif", "Une demande de modification", "Toujours un défaut confirmé"], "ans": [0, 1, 2], "exp": "Une anomalie peut être un défaut, un faux positif ou une demande de changement ; le workflow clarifie let current = 0;
let answers = Array.from({length: questions.length}, () => []);
let remaining = 45 * 60;
let submitted = false;

function sameArray(a,b) {
  a = [...a].sort((x,y)=>x-y); b = [...b].sort((x,y)=>x-y);
  return a.length === b.length && a.every((v,i)=>v===b[i]);
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qcount').textContent = `Question ${current+1} / ${questions.length}`;
  document.getElementById('qtype').textContent = q.type === 'multi' ? 'Plusieurs réponses possibles' : 'Une seule réponse';
  document.getElementById('question').textContent = q.q;
  document.getElementById('progress').style.width = `${((current+1)/questions.length)*100}%`;
  const options = document.getElementById('options');
  options.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const selected = answers[current].includes(i);
    const label = document.createElement('label');
    label.className = 'option' + (selected ? ' selected' : '');
    const type = q.type === 'multi' ? 'checkbox' : 'radio';
    label.innerHTML = `<input type="${type}" name="q" value="${i}" ${selected?'checked':''}> <span><b>${String.fromCharCode(65+i)}.</b> ${opt}</span>`;
    label.onclick = () => selectAnswer(i);
    options.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').style.display = current === questions.length - 1 ? 'none' : 'inline-block';
  document.getElementById('submitBtn').style.display = current === questions.length - 1 ? 'inline-block' : 'none';
  renderGrid();
}

function selectAnswer(i) {
  const q = questions[current];
  if (q.type === 'single') answers[current] = [i];
  else {
    if (answers[current].includes(i)) answers[current] = answers[current].filter(x => x !== i);
    else answers[current].push(i);
  }
  renderQuestion();
}

function nextQuestion() { if (current < questions.length - 1) { current++; renderQuestion(); } }
function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }
function goTo(i) { current = i; renderQuestion(); }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'jump' + (i === current ? ' current' : '') + (answers[i].length ? ' answered' : '');
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}

function tick() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (remaining <= 0) submitExam();
  remaining--;
}

function submitExam() {
  if (submitted) return;
  submitted = true;
  clearInterval(clock);
  let score = 0, answered = 0, review = '';
  questions.forEach((q, i) => {
    const ok = sameArray(answers[i], q.ans);
    if (answers[i].length) answered++;
    if (ok) score++;
    const your = answers[i].length ? answers[i].sort((a,b)=>a-b).map(n => `${String.fromCharCode(65+n)}. ${q.opts[n]}`).join('<br>') : '<i>Aucune réponse</i>';
    const good = q.ans.sort((a,b)=>a-b).map(n => `${String.fromCharCode(65+n)}. ${q.opts[n]}`).join('<br>');
    review += `<div class="review ${ok?'ok':'ko'}">
      <b>Q${i+1} — ${ok?'✅ Correct':'❌ Incorrect'}</b><br>
      <span class="small">Ta réponse :</span><br>${your}<br>
      <span class="small">Bonne réponse :</span><br>${good}<br>
      <span class="small">Explication :</span> ${q.exp}
    </div>`;
  });
  const percent = Math.round((score / questions.length) * 100);
  const passed = percent >= 65;
  document.getElementById('exam').style.display = 'none';
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <h2>Résultat final</h2>
    <div class="score ${passed?'pass':'fail'}">${percent}%</div>
    <h3>${passed?'✅ Réussi':'❌ Échec'} — ${score} / 40</h3>
    <p>Questions répondues : ${answered} / 40. Seuil de réussite : 65%.</p>
    ${answered < 40 ? '<div class="warning">Attention : certaines questions n’ont pas été répondues.</div>' : ''}
    <button class="next" onclick="location.reload()">Recommencer</button>
    <h3>Correction détaillée</h3>
    ${review}
  `;
  window.scrollTo({top:0, behavior:'smooth'});
}

renderQuestion();
tick();
const clock = setInterval(tick, 1000);
</script>
