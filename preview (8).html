<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB Chapitre 2 - Examen Blanc</title>
<style>
:root {
  --bg:#eef2f7; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --blue:#2563eb;
  --blue2:#1d4ed8; --green:#16a34a; --red:#dc2626; --border:#dbe3ef;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
.header { background:#1e293b; color:white; padding:18px 24px; box-shadow:0 2px 10px rgba(0,0,0,.18); position:sticky; top:0; z-index:99; }
.header-inner { max-width:980px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:14px; }
h1 { margin:0; font-size:24px; }
.timer { font-size:24px; font-weight:bold; color:#facc15; background:#0f172a; padding:10px 16px; border-radius:10px; min-width:110px; text-align:center; }
.container { max-width:980px; margin:24px auto; padding:0 18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 24px rgba(15,23,42,.08); padding:24px; }
.meta { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.badge { background:#dbeafe; color:#1e40af; padding:7px 10px; border-radius:999px; font-size:13px; font-weight:bold; }
.progress-wrap { background:#e5e7eb; height:12px; border-radius:999px; overflow:hidden; margin:14px 0 22px; }
.progress { height:100%; background:var(--blue); width:0%; transition:.25s; }
.qtop { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; color:var(--muted); }
.qtype { font-weight:bold; color:#475569; }
.question-title { font-size:20px; font-weight:bold; margin:16px 0 20px; line-height:1.45; }
.option { display:flex; gap:12px; align-items:flex-start; padding:14px; margin:11px 0; border:2px solid #e5e7eb; border-radius:12px; cursor:pointer; background:#f9fafb; transition:.15s; }
.option:hover { border-color:#93c5fd; background:#eff6ff; }
.option input { margin-top:2px; transform:scale(1.2); }
.option.selected { border-color:var(--blue); background:#eff6ff; }
.nav { display:flex; justify-content:space-between; gap:12px; margin-top:24px; }
button { border:0; border-radius:10px; padding:13px 18px; font-weight:bold; font-size:15px; cursor:pointer; }
button:disabled { opacity:.45; cursor:not-allowed; }
.prev { background:#e5e7eb; color:#374151; }
.next { background:var(--blue); color:white; }
.next:hover { background:var(--blue2); }
.submit { background:var(--green); color:white; }
.grid { display:grid; grid-template-columns:repeat(10,1fr); gap:8px; margin-top:18px; }
.jump { padding:9px 0; border-radius:8px; background:#e5e7eb; color:#374151; font-size:13px; }
.jump.current { background:var(--blue); color:white; }
.jump.answered { background:#bbf7d0; color:#166534; }
.result { display:none; }
.score { font-size:48px; font-weight:900; margin:10px 0; }
.pass { color:var(--green); } .fail { color:var(--red); }
.review { border-left:5px solid #94a3b8; background:#f8fafc; padding:14px; border-radius:10px; margin:12px 0; }
.review.ok { border-left-color:var(--green); }
.review.ko { border-left-color:var(--red); }
.small { color:var(--muted); font-size:14px; }
.warning { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:12px; border-radius:12px; margin:12px 0; }
@media(max-width:700px) {
  .header-inner { flex-direction:column; align-items:flex-start; }
  .grid { grid-template-columns:repeat(5,1fr); }
  .nav { flex-direction:column; }
}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div>
      <h1>ISTQB Fondation v4.0 — Chapitre 2</h1>
      <div class="small" style="color:#cbd5e1">Mode examen : 40 questions difficiles, cas réels, pièges ISTQB</div>
    </div>
    <div class="timer" id="timer">30:00</div>
  </div>
</div>

<div class="container">
  <div id="exam" class="card">
    <div class="meta">
      <span class="badge">40 questions</span>
      <span class="badge">30 minutes</span>
      <span class="badge">Seuil 65%</span>
      <span class="badge">Score sur 100%</span>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="qtop">
      <span id="qcount"></span>
      <span class="qtype" id="qtype"></span>
    </div>
    <div class="question-title" id="question"></div>
    <div id="options"></div>
    <div class="nav">
      <button class="prev" id="prevBtn" onclick="prevQuestion()">← Précédent</button>
      <button class="next" id="nextBtn" onclick="nextQuestion()">Suivant →</button>
      <button class="submit" id="submitBtn" onclick="submitExam()" style="display:none">Valider l’examen</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="result" class="card result"></div>
</div>

<script>
const questions = [{"q": "Dans un modèle en cascade, à quel moment les tests dynamiques peuvent-ils généralement commencer ?", "type": "single", "opts": ["Dès la revue des exigences", "Uniquement après la mise en production", "Quand du code exécutable est disponible dans les phases ultérieures", "Avant toute analyse de test"], "ans": [2], "exp": "Dans les modèles séquentiels, le code exécutable est souvent produit tard, donc les tests dynamiques commencent généralement plus tard."}, {"q": "Une équipe Scrum livre un incrément potentiellement utilisable toutes les deux semaines. Quelle conséquence sur les tests est la plus probable ?", "type": "single", "opts": ["Suppression des tests statiques", "Feedback rapide et tests de régression fréquents", "Aucun test dynamique avant la fin du projet", "Documentation de test très détaillée obligatoire"], "ans": [1], "exp": "Les modèles itératifs/incrémentaux impliquent des tests statiques et dynamiques fréquents, avec besoin de feedback rapide et régression."}, {"q": "Quels éléments sont influencés par le cycle de vie du développement logiciel choisi ?", "type": "multi", "opts": ["Le degré d’automatisation", "La règle selon laquelle le test exhaustif devient possible", "Le calendrier des activités de test", "Le rôle et les responsabilités du testeur"], "ans": [0, 2, 3], "exp": "Le SDLC influence calendrier, périmètre, documentation, techniques, automatisation et rôles, mais ne rend pas le test exhaustif possible."}, {"q": "Quelle bonne pratique s’applique à tous les cycles de vie ?", "type": "single", "opts": ["Les tests doivent toujours être uniquement manuels", "Les testeurs doivent intervenir uniquement à la fin", "Chaque activité de développement devrait avoir une activité de test correspondante", "Tous les niveaux de test ont exactement le même objectif"], "ans": [2], "exp": "Une bonne pratique générale est d’associer une activité de test à chaque activité de développement."}, {"q": "Quelle affirmation décrit correctement l’analyse et la conception des tests dans une bonne pratique SDLC ?", "type": "single", "opts": ["Elles doivent attendre la fin des tests système", "Elles commencent pendant la phase de développement correspondante", "Elles commencent après la livraison", "Elles sont inutiles en Agile"], "ans": [1], "exp": "L’analyse et la conception des tests doivent commencer pendant la phase de développement correspondante pour tester tôt."}, {"q": "Quel exemple illustre le mieux le shift-left ?", "type": "single", "opts": ["Relire les exigences du point de vue test dès leur première version", "Tester uniquement en production", "Supprimer les tests tardifs", "Attendre l’intégration complète pour commencer tous les tests"], "ans": [0], "exp": "Le shift-left consiste à tester plus tôt, par exemple par revues des spécifications et tests définis avant le code."}, {"q": "Que signifie correctement shift-left ?", "type": "single", "opts": ["Remplacer les tests dynamiques par des revues uniquement", "Déplacer tous les tests vers la fin", "Automatiser uniquement après livraison", "Effectuer des tests plus tôt sans négliger les phases ultérieures"], "ans": [3], "exp": "Le shift-left signifie tester plus tôt, mais pas abandonner les tests ultérieurs."}, {"q": "Quel énoncé sur TDD est correct ?", "type": "single", "opts": ["Les tests d’acceptation métier sont écrits en Given/When/Then", "TDD impose une conception détaillée avant tout test", "TDD concerne uniquement les tests système manuels", "Les tests sont écrits avant le code, puis le code est écrit pour les satisfaire et refactorisé"], "ans": [3], "exp": "En TDD, les tests guident le codage : écrire test, écrire code, refactoriser."}, {"q": "Quel énoncé décrit le mieux ATDD ?", "type": "single", "opts": ["Tests écrits uniquement par l’exploitation", "Tests dérivés du code source après implémentation", "Tests de performance uniquement", "Tests dérivés des critères d’acceptation avant le développement de la fonctionnalité"], "ans": [3], "exp": "ATDD dérive les tests des critères d’acceptation et les définit avant le développement concerné."}, {"q": "Quel énoncé décrit le mieux BDD ?", "type": "single", "opts": ["Tests d’intégration système exclusivement", "Tests exprimant le comportement souhaité en langage naturel, souvent Given/When/Then", "Tests écrits après mise en production", "Tests uniquement basés sur la structure du code"], "ans": [1], "exp": "BDD exprime le comportement attendu dans une forme compréhensible par les parties prenantes."}, {"q": "Quels sont des exemples d’approches où les tests pilotent le développement ?", "type": "multi", "opts": ["BDD", "ATDD", "Big-bang integration", "TDD"], "ans": [0, 1, 3], "exp": "TDD, ATDD et BDD définissent des tests avant le code pour orienter le développement."}, {"q": "Quel avantage DevOps apporte-t-il au test ?", "type": "single", "opts": ["Feedback rapide sur la qualité et l’impact des changements", "Interdiction des tests non fonctionnels", "Suppression totale des tests manuels", "Absence de besoin d’outils CI/CD"], "ans": [0], "exp": "DevOps favorise feedback rapide, CI/CD, automatisation et visibilité sur la qualité."}, {"q": "Quel risque ou défi DevOps est réaliste ?", "type": "single", "opts": ["Les tests manuels deviennent toujours interdits", "Les tests de régression deviennent inutiles", "Le pipeline CI/CD doit être défini, établi et maintenu", "Les tests automatisés ne nécessitent aucune maintenance"], "ans": [2], "exp": "DevOps nécessite pipeline, outils CI/CD et maintenance de l’automatisation."}, {"q": "Dans DevOps, quel énoncé est le plus juste concernant les tests manuels ?", "type": "single", "opts": ["Ils remplacent CI/CD", "Ils sont interdits dans un pipeline", "Ils restent nécessaires, notamment du point de vue utilisateur", "Ils disparaissent totalement"], "ans": [2], "exp": "Même avec une forte automatisation, des tests manuels restent nécessaires."}, {"q": "Quel bénéfice DevOps réduit le risque de régression ?", "type": "single", "opts": ["Tests de régression automatisés larges et fréquents dans le pipeline", "Moins de communication entre développement et exploitation", "Suppression des environnements de test", "Tests uniquement après incident"], "ans": [0], "exp": "Les pipelines DevOps permettent d’exécuter régulièrement des suites de régression automatisées."}, {"q": "Quel objectif principal des rétrospectives est correct ?", "type": "single", "opts": ["Éviter les changements de processus", "Remplacer tous les rapports de test", "Désigner un coupable", "Identifier succès, problèmes et améliorations à suivre"], "ans": [3], "exp": "Les rétrospectives servent à l’amélioration continue en conservant les succès et en corrigeant les problèmes."}, {"q": "Quels bénéfices les rétrospectives peuvent-elles apporter aux tests ?", "type": "multi", "opts": ["Meilleure coopération développement-test", "Amélioration de l’efficacité et de l’efficience des tests", "Garantie d’absence de défauts", "Amélioration de la qualité du testware"], "ans": [0, 1, 3], "exp": "Les rétrospectives améliorent processus, testware, coopération et apprentissage, mais ne garantissent pas zéro défaut."}, {"q": "Quel niveau de test se concentre sur des composants isolés et est souvent réalisé par les développeurs ?", "type": "single", "opts": ["Tests d’acceptation", "Tests système", "Tests d’intégration système", "Tests de composants"], "ans": [3], "exp": "Les tests de composants se concentrent sur les unités ou composants isolés."}, {"q": "Quel niveau teste principalement les interfaces et interactions entre composants ?", "type": "single", "opts": ["Tests d’acceptation réglementaire", "Tests d’intégration de composants", "Tests système", "Tests bêta"], "ans": [1], "exp": "Les tests d’intégration de composants vérifient les interactions entre composants."}, {"q": "Quel niveau teste le comportement global d’un système ou produit entier ?", "type": "single", "opts": ["Tests de composants", "Tests d’intégration de composants", "Tests système", "Tests alpha"], "ans": [2], "exp": "Les tests système portent sur le système complet et ses capacités globales."}, {"q": "Quel niveau vise les interfaces entre le système sous test et d’autres systèmes ou services externes ?", "type": "single", "opts": ["Tests d’intégration système", "Tests unitaires", "Tests d’acceptation utilisateur", "Tests de composants"], "ans": [0], "exp": "Les tests d’intégration système ciblent les interactions avec systèmes/services externes."}, {"q": "Quel niveau est axé sur la validation et l’aptitude au déploiement selon les besoins métier ?", "type": "single", "opts": ["Tests boîte blanche", "Tests de composants", "Tests d’intégration de composants", "Tests d’acceptation"], "ans": [3], "exp": "Les tests d’acceptation valident l’aptitude au déploiement et la satisfaction des besoins métier."}, {"q": "Quels sont des exemples de tests d’acceptation ?", "type": "multi", "opts": ["Tests d’acceptation opérationnelle", "Tests de composants isolés", "Tests alpha et bêta", "Tests d’acceptation utilisateur"], "ans": [0, 2, 3], "exp": "UAT, opérationnel, contractuel/réglementaire, alpha et bêta sont des formes d’acceptation."}, {"q": "Un test vérifie que la fonction “réinitialiser mot de passe” envoie bien un email valide. Quel type de test est principalement concerné ?", "type": "single", "opts": ["Fonctionnel", "Maintenance uniquement", "Non fonctionnel", "Boîte blanche uniquement"], "ans": [0], "exp": "Le test fonctionnel vérifie ce que le système doit faire."}, {"q": "Un test vérifie que la recherche retourne les résultats en moins de deux secondes sous charge normale. Quel type est principalement concerné ?", "type": "single", "opts": ["Acceptation réglementaire", "Confirmation", "Fonctionnel", "Non fonctionnel"], "ans": [3], "exp": "Le test non fonctionnel vérifie comment le système se comporte, par exemple performance."}, {"q": "Quels attributs relèvent des tests non fonctionnels selon ISO/IEC 25010 ?", "type": "multi", "opts": ["Exactitude fonctionnelle uniquement", "Utilisabilité", "Performance", "Sécurité"], "ans": [1, 2, 3], "exp": "Performance, utilisabilité, sécurité, fiabilité, compatibilité, maintenabilité et portabilité sont non fonctionnels."}, {"q": "Quel énoncé décrit le test boîte noire ?", "type": "single", "opts": ["Tests limités au test de composants", "Tests dérivés du code et de la structure interne", "Tests uniquement non fonctionnels", "Tests dérivés des spécifications et documentation externe à l’objet de test"], "ans": [3], "exp": "Le test boîte noire se base sur les spécifications et le comportement externe."}, {"q": "Quel énoncé décrit le test boîte blanche ?", "type": "single", "opts": ["Tests basés sur la structure interne, comme code, architecture ou flux", "Tests de validation métier uniquement", "Tests basés uniquement sur les exigences utilisateur", "Tests réalisés uniquement par le client"], "ans": [0], "exp": "Le test boîte blanche dérive les tests de l’implémentation ou structure interne."}, {"q": "Peut-on appliquer les types fonctionnel, non fonctionnel, boîte noire et boîte blanche à plusieurs niveaux de test ?", "type": "single", "opts": ["Oui, ils peuvent s’appliquer à tous les niveaux, avec un accent différent", "Non, boîte blanche seulement en acceptation", "Non, non fonctionnel seulement après production", "Non, chaque type appartient à un seul niveau"], "ans": [0], "exp": "Ces types peuvent être appliqués à tous les niveaux selon le contexte."}, {"q": "Un défaut corrigé a causé l’échec du test TC-17. L’équipe réexécute TC-17 pour vérifier que l’échec ne se produit plus. C’est :", "type": "single", "opts": ["Un test de maintenance uniquement", "Un test de confirmation", "Un test d’intégration système", "Un test de régression"], "ans": [1], "exp": "Le test de confirmation vérifie que le défaut original a été corrigé."}, {"q": "Après correction d’un défaut dans le paiement, l’équipe teste aussi les remboursements et factures pour vérifier l’absence d’effets de bord. C’est :", "type": "single", "opts": ["Un test de confirmation uniquement", "Un test alpha", "Un test de régression", "Un test boîte noire obligatoire"], "ans": [2], "exp": "Le test de régression vérifie qu’une modification n’a pas causé de conséquences négatives ailleurs."}, {"q": "Quelle différence entre test de confirmation et test de régression est correcte ?", "type": "single", "opts": ["Régression = uniquement tests manuels", "Confirmation = tester tout le système ; Régression = tester le défaut original seulement", "Les deux sont synonymes", "Confirmation = vérifier le défaut corrigé ; Régression = vérifier l’absence d’effets négatifs dus au changement"], "ans": [3], "exp": "Confirmation cible le défaut corrigé ; régression cible les impacts indésirables."}, {"q": "Avant de définir l’étendue d’une régression, quelle activité est conseillée ?", "type": "single", "opts": ["Suppression des anciens tests", "Déploiement direct", "Analyse d’impact", "Rétrospective uniquement"], "ans": [2], "exp": "L’analyse d’impact aide à identifier les parties potentiellement affectées et optimiser la régression."}, {"q": "Pourquoi les suites de régression sont-elles de bonnes candidates à l’automatisation ?", "type": "single", "opts": ["Elles remplacent toute validation", "Elles ne contiennent que des tests exploratoires", "Elles sont exécutées souvent et grossissent avec les itérations/releases", "Elles ne changent jamais et ne nécessitent jamais de maintenance"], "ans": [2], "exp": "Les tests de régression sont répétés fréquemment et leur volume augmente, d’où l’intérêt de l’automatisation."}, {"q": "Dans quel cas des tests de maintenance sont nécessaires ?", "type": "single", "opts": ["Uniquement avant la première version", "Jamais pour les hotfixes", "Uniquement si aucun risque n’existe", "Après modification d’un système en production"], "ans": [3], "exp": "Les tests de maintenance concernent les changements sur systèmes en production, planifiés ou non."}, {"q": "Quels déclencheurs peuvent conduire à des tests de maintenance ?", "type": "multi", "opts": ["Migration de plateforme", "Amélioration planifiée ou correctif à chaud", "Retrait d’une application", "Création initiale d’un prototype sans système existant"], "ans": [0, 1, 2], "exp": "Modifications, migrations et retrait sont des déclencheurs classiques de maintenance."}, {"q": "Le périmètre des tests de maintenance dépend principalement de :", "type": "multi", "opts": ["Couleur de l’interface", "Taille du système existant", "Ampleur des modifications", "Degré de risque des changements"], "ans": [1, 2, 3], "exp": "Le risque, la taille du système et l’ampleur des modifications influencent le périmètre."}, {"q": "Lors d’une migration de données depuis une ancienne application, quel test peut être nécessaire ?", "type": "single", "opts": ["Test de conversion des données", "Test alpha uniquement", "Test de composants isolés uniquement", "Aucun test si le code ne change pas"], "ans": [0], "exp": "Une migration peut nécessiter des tests du nouvel environnement et de conversion des données."}, {"q": "Lors du retrait d’une application avec obligation de conservation légale des données, quels tests peuvent être nécessaires ?", "type": "multi", "opts": ["Tests d’archivage des données", "Tests de suppression totale sans contrôle", "Tests de restauration/extraction des données archivées", "Tests d’acceptation du nouveau logo uniquement"], "ans": [0, 2], "exp": "Le retrait peut nécessiter archivage et restauration/extraction pendant la période de conservation."}, {"q": "Un test utilise les mêmes scénarios fonctionnels de connexion mais vérifie cette fois la compatibilité sur plusieurs navigateurs. Quel énoncé est le plus juste ?", "type": "single", "opts": ["C’est impossible dans ISTQB", "C’est forcément un test fonctionnel uniquement", "C’est un test de confirmation", "Un test non fonctionnel peut dériver de tests fonctionnels tout en vérifiant une contrainte qualité"], "ans": [3], "exp": "De nombreux tests non fonctionnels réutilisent des scénarios fonctionnels mais vérifient une caractéristique qualité."}];
let current = 0;
let answers = Array.from({length: questions.length}, () => []);
let remaining = 30 * 60;
let submitted = false;

function sameArray(a,b) {
  a = [...a].sort((x,y)=>x-y); b = [...b].sort((x,y)=>x-y);
  return a.length === b.length && a.every((v,i)=>v===b[i]);
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qcount').textContent = `Question ${current+1} / ${questions.length}`;
  document.getElementById('qtype').textContent = q.type === 'multi' ? 'Plusieurs réponses possibles' : 'Une seule réponse';
  document.getElementById('question').textContent = q.q;
  document.getElementById('progress').style.width = `${((current+1)/questions.length)*100}%`;
  const options = document.getElementById('options');
  options.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const selected = answers[current].includes(i);
    const label = document.createElement('label');
    label.className = 'option' + (selected ? ' selected' : '');
    const type = q.type === 'multi' ? 'checkbox' : 'radio';
    label.innerHTML = `<input type="${type}" name="q" value="${i}" ${selected?'checked':''}> <span><b>${String.fromCharCode(65+i)}.</b> ${opt}</span>`;
    label.onclick = () => selectAnswer(i);
    options.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').style.display = current === questions.length - 1 ? 'none' : 'inline-block';
  document.getElementById('submitBtn').style.display = current === questions.length - 1 ? 'inline-block' : 'none';
  renderGrid();
}

function selectAnswer(i) {
  const q = questions[current];
  if (q.type === 'single') answers[current] = [i];
  else {
    if (answers[current].includes(i)) answers[current] = answers[current].filter(x => x !== i);
    else answers[current].push(i);
  }
  renderQuestion();
}

function nextQuestion() { if (current < questions.length - 1) { current++; renderQuestion(); } }
function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }
function goTo(i) { current = i; renderQuestion(); }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'jump' + (i === current ? ' current' : '') + (answers[i].length ? ' answered' : '');
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}

function tick() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (remaining <= 0) submitExam();
  remaining--;
}

function submitExam() {
  if (submitted) return;
  submitted = true;
  clearInterval(clock);
  let score = 0, answered = 0, review = '';
  questions.forEach((q, i) => {
    const ok = sameArray(answers[i], q.ans);
    if (answers[i].length) answered++;
    if (ok) score++;
    const your = answers[i].length ? answers[i].sort((a,b)=>a-b).map(n => `${String.fromCharCode(65+n)}. ${q.opts[n]}`).join('<br>') : '<i>Aucune réponse</i>';
    const good = q.ans.sort((a,b)=>a-b).map(n => `${String.fromCharCode(65+n)}. ${q.opts[n]}`).join('<br>');
    review += `<div class="review ${ok?'ok':'ko'}">
      <b>Q${i+1} — ${ok?'✅ Correct':'❌ Incorrect'}</b><br>
      <span class="small">Ta réponse :</span><br>${your}<br>
      <span class="small">Bonne réponse :</span><br>${good}<br>
      <span class="small">Explication :</span> ${q.exp}
    </div>`;
  });
  const percent = Math.round((score / questions.length) * 100);
  const passed = percent >= 65;
  document.getElementById('exam').style.display = 'none';
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <h2>Résultat final</h2>
    <div class="score ${passed?'pass':'fail'}">${percent}%</div>
    <h3>${passed?'✅ Réussi':'❌ Échec'} — ${score} / 40</h3>
    <p>Questions répondues : ${answered} / 40. Seuil de réussite : 65%.</p>
    ${answered < 40 ? '<div class="warning">Attention : certaines questions n’ont pas été répondues.</div>' : ''}
    <button class="next" onclick="location.reload()">Recommencer</button>
    <h3>Correction détaillée</h3>
    ${review}
  `;
  window.scrollTo({top:0, behavior:'smooth'});
}

renderQuestion();
tick();
const clock = setInterval(tick, 1000);
</script>
</body>
</html>
