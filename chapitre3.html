<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examen blanc ISTQB - Chapitre 3 : Test statique</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f6f7fb; margin: 0; color: #1f2937; }
    header { background: #111827; color: white; padding: 24px; text-align: center; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .timer { position: sticky; top: 0; z-index: 10; background: #fff7ed; border-bottom: 1px solid #fed7aa; padding: 12px; text-align: center; font-weight: bold; }
    .info, .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .question-title { font-weight: bold; margin-bottom: 12px; line-height: 1.45; }
    .tag { display: inline-block; font-size: 12px; background: #e5e7eb; padding: 3px 8px; border-radius: 999px; margin-bottom: 8px; }
    label { display: block; margin: 9px 0; cursor: pointer; line-height: 1.35; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0; }
    button { border: none; border-radius: 8px; padding: 12px 18px; cursor: pointer; font-weight: bold; font-size: 15px; }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e5e7eb; }
    .result { font-size: 20px; font-weight: bold; padding: 18px; border-radius: 12px; margin-bottom: 20px; display: none; }
    .pass { background: #dcfce7; color: #166534; }
    .fail { background: #fee2e2; color: #991b1b; }
    .correction { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; line-height: 1.45; }
    .correct { background: #dcfce7; }
    .wrong { background: #fee2e2; }
  </style>
</head>
<body>
<header>
  <h1>Examen blanc ISTQB — Chapitre 3</h1>
  <p>Test statique — niveau difficile, pièges ISTQB, cas réels</p>
</header>
<div class="timer" id="timer">Temps restant : 60:00</div>
<main>
  <div class="info">
    <strong>Consignes :</strong> 40 questions — score strict comme ISTQB. Une question multi-réponses vaut 1 point uniquement si toutes les réponses sont exactes. Seuil de réussite : 65%.
  </div>
  <div id="result" class="result"></div>
  <form id="quizForm"></form>
  <div class="actions">
    <button class="primary" type="button" onclick="corriger()">Terminer et afficher le score</button>
    <button class="secondary" type="button" onclick="location.reload()">Recommencer</button>
  </div>
</main>
<script>
let timeLeft = 30 * 60;
let timerInterval = setInterval(() => {
  const min = Math.floor(timeLeft / 60);
  const sec = timeLeft % 60;
  document.getElementById('timer').innerText = `Temps restant : ${min}:${sec < 10 ? '0' : ''}${sec}`;
  timeLeft--;
  if (timeLeft < 0) {
    clearInterval(timerInterval);
    alert('Temps écoulé. Correction automatique.');
    corriger();
  }
}, 1000);

const questions = [
{tag:'K1 - connaissance',q:'1. Lequel des éléments suivants décrit le mieux le test statique ?',type:'single',options:{A:'Exécution du logiciel avec des données de test',B:'Évaluation d’un produit d’activité sans exécuter le logiciel',C:'Recherche de défaillances uniquement en production',D:'Mesure exclusive du temps de réponse'},answer:['B'],exp:'Le test statique évalue des produits d’activité sans exécution.'},
{tag:'K1 - produits examinables',q:'2. Quels produits peuvent généralement être examinés par test statique ?',type:'multi',options:{A:'Spécification d’exigences',B:'Code source',C:'Cas de test',D:'Contrat'},answer:['A','B','C','D'],exp:'Presque tout produit lisible et compréhensible peut être revu.'},
{tag:'K2 - piège',q:'3. Une équipe veut analyser automatiquement un fichier binaire exécutable fourni par un tiers, sans accès au code source, et le contrat interdit l’analyse. Quelle conclusion est la plus correcte ?',type:'single',options:{A:'C’est un bon candidat pour l’analyse statique',B:'C’est possible car tout produit logiciel peut être testé statiquement',C:'Ce produit est peu adapté au test statique dans ce contexte',D:'Il faut obligatoirement faire une inspection formelle'},answer:['C'],exp:'Un produit difficile à interpréter et non autorisé légalement n’est pas adapté.'},
{tag:'K2 - valeur',q:'4. Parmi les affirmations suivantes, lesquelles décrivent une valeur réelle du test statique ?',type:'multi',options:{A:'Détecter tôt certains défauts',B:'Améliorer la compréhension commune des exigences',C:'Remplacer tous les tests dynamiques',D:'Réduire les coûts de correction tardive'},answer:['A','B','D'],exp:'Le test statique complète le test dynamique, il ne le remplace pas.'},
{tag:'K2 - statique vs dynamique',q:'5. Quelle affirmation compare correctement test statique et test dynamique ?',type:'single',options:{A:'Le test statique provoque des défaillances pour révéler les défauts',B:'Le test dynamique constate directement les défauts sans analyse',C:'Le test statique peut détecter directement des défauts',D:'Le test dynamique peut s’appliquer à tout document non exécutable'},answer:['C'],exp:'Le test dynamique observe des défaillances puis nécessite une analyse pour identifier les défauts.'},
{tag:'K2 - défauts typiques',q:'6. Quels défauts sont généralement plus faciles ou moins coûteux à trouver par test statique ?',type:'multi',options:{A:'Code inaccessible',B:'Ambiguïté dans une exigence',C:'Variable non déclarée',D:'Dégradation réelle de performance sous forte charge'},answer:['A','B','C'],exp:'La performance sous charge dépend de l’exécution.'},
{tag:'Cas réel',q:'7. Une User Story dit : « En tant que client, je veux payer rapidement afin de gagner du temps ». Aucun critère d’acceptation n’est défini. Quel apport du test statique est le plus pertinent ?',type:'single',options:{A:'Exécuter directement un test de charge',B:'Clarifier la Story et produire des critères d’acceptation testables',C:'Ignorer la Story jusqu’au développement',D:'Créer uniquement des tests unitaires'},answer:['B'],exp:'Les revues et ateliers BDD aident à rendre les User Stories compréhensibles et testables.'},
{tag:'K1 - feedback',q:'8. Quels sont des avantages du feedback précoce et fréquent des parties prenantes ?',type:'multi',options:{A:'Réduire les malentendus sur les exigences',B:'S’assurer plus tôt que le produit correspond aux besoins',C:'Éviter des corrections coûteuses tardives',D:'Supprimer la nécessité d’une revue individuelle'},answer:['A','B','C'],exp:'Le feedback fréquent ne supprime pas les activités de revue.'},
{tag:'K2 - processus revue',q:'9. Pendant quelle activité les réviseurs identifient-ils individuellement anomalies, questions et recommandations ?',type:'single',options:{A:'Planification',B:'Lancement de la revue',C:'Revue individuelle',D:'Correction et rapport'},answer:['C'],exp:'La revue individuelle sert à évaluer le produit et enregistrer les anomalies.'},
{tag:'K2 - processus revue',q:'10. Lors d’une réunion, les participants décident si une anomalie est réellement un défaut, désignent un responsable et définissent une action. Quelle activité est principalement concernée ?',type:'single',options:{A:'Lancement',B:'Communication et analyse',C:'Planification',D:'Revue individuelle'},answer:['B'],exp:'Les anomalies sont analysées et discutées pendant communication et analyse.'},
{tag:'K1 - rôles',q:'11. Qui décide généralement de ce qui doit être revu et fournit les ressources nécessaires ?',type:'single',options:{A:'Manager',B:'Scribe',C:'Réviseur',D:'Auteur'},answer:['A'],exp:'Le manager décide et fournit temps/personnel.'},
{tag:'K1 - rôles',q:'12. Qui crée et corrige le produit d’activité en cours de revue ?',type:'single',options:{A:'Modérateur',B:'Auteur',C:'Scribe',D:'Responsable de revue'},answer:['B'],exp:'L’auteur crée et corrige le produit revu.'},
{tag:'K1 - rôles',q:'13. Quel rôle est responsable de la médiation, de la gestion du temps et d’un environnement sûr pendant une réunion de revue ?',type:'single',options:{A:'Scribe',B:'Auteur',C:'Modérateur',D:'Manager'},answer:['C'],exp:'Le modérateur facilite la réunion.'},
{tag:'K1 - rôles',q:'14. Quel rôle rassemble les anomalies des réviseurs et enregistre les décisions ?',type:'single',options:{A:'Scribe',B:'Manager',C:'Auteur',D:'Responsable de revue'},answer:['A'],exp:'Le scribe/rapporteur consigne les informations de revue.'},
{tag:'K2 - piège inspection',q:'15. Lors d’une inspection, quels rôles l’auteur ne peut-il pas jouer ?',type:'multi',options:{A:'Réviseur',B:'Scribe',C:'Auteur',D:'Créateur du produit'},answer:['A','B'],exp:'En inspection, l’auteur ne peut pas être réviseur ni scribe.'},
{tag:'K2 - types revue',q:'16. Quelle proposition décrit correctement une revue informelle ?',type:'single',options:{A:'Elle suit toujours le processus complet ISO/IEC 20246',B:'Elle ne suit pas un processus défini et ne requiert pas de résultat formel documenté',C:'Elle impose la collecte de métriques',D:'Elle interdit la détection d’anomalies'},answer:['B'],exp:'La revue informelle est peu formelle et vise souvent la détection d’anomalies.'},
{tag:'K2 - types revue',q:'17. Quelle revue est menée par l’auteur et peut servir à former, obtenir un consensus ou générer des idées ?',type:'single',options:{A:'Inspection',B:'Relecture technique',C:'Revue informelle',D:'Analyse statique automatique'},answer:['B'],exp:'La relecture technique est menée par l’auteur.'},
{tag:'K2 - types revue',q:'18. Une équipe d’architectes doit prendre une décision technique sur une interface critique. Des experts techniques examinent le document et un modérateur dirige la réunion. Quel type de revue est le plus adapté ?',type:'single',options:{A:'Revue technique',B:'Revue informelle',C:'Relecture technique menée uniquement par l’auteur',D:'Test dynamique'},answer:['A'],exp:'La revue technique est dirigée par un modérateur et vise consensus/décisions techniques.'},
{tag:'K2 - types revue',q:'19. Quelles caractéristiques correspondent à une inspection ?',type:'multi',options:{A:'Type de revue le plus formel',B:'Processus générique complet',C:'Collecte de métriques',D:'Objectif principal : trouver le maximum d’anomalies'},answer:['A','B','C','D'],exp:'Toutes ces caractéristiques correspondent à l’inspection.'},
{tag:'K1 - facteurs succès',q:'20. Quels facteurs contribuent au succès d’une revue ?',type:'multi',options:{A:'Objectifs clairs',B:'Critères de sortie mesurables',C:'Temps suffisant de préparation',D:'Évaluation individuelle des participants'},answer:['A','B','C'],exp:'Évaluer les participants ne doit jamais être un objectif.'},
{tag:'Cas réel',q:'21. Une équipe organise une revue de 4 heures avec 18 participants, sans préparation individuelle. Le résultat est faible. Quel facteur de réussite est principalement absent ?',type:'single',options:{A:'Réaliser des revues en petits groupes et laisser du temps de préparation',B:'Supprimer le modérateur',C:'Évaluer les participants',D:'Remplacer la revue par un test de performance'},answer:['A'],exp:'Petits groupes et préparation sont essentiels.'},
{tag:'Cas réel',q:'22. Une exigence dit : « Le système doit répondre rapidement ». Quel type de défaut peut être identifié par revue ?',type:'single',options:{A:'Ambiguïté d’exigence',B:'Défaillance CPU',C:'Fuite mémoire prouvée en production',D:'Timeout mesuré'},answer:['A'],exp:'« Rapidement » est ambigu sans seuil mesurable.'},
{tag:'Cas réel',q:'23. Une analyse statique indique une fonction jamais appelée. Aucun test dynamique existant ne l’exécute. Quel énoncé est le plus correct ?',type:'single',options:{A:'Le problème ne peut être détecté que par test dynamique',B:'Le test statique est utile car il détecte du code inaccessible ou rarement exécuté',C:'Il faut ignorer le résultat car les outils statiques sont toujours faux',D:'C’est forcément une défaillance utilisateur'},answer:['B'],exp:'Le code inaccessible est un défaut typique détectable statiquement.'},
{tag:'K2 - caractéristiques qualité',q:'24. Quelle caractéristique qualité peut souvent être évaluée sans exécution du code ?',type:'single',options:{A:'Maintenabilité',B:'Performance sous charge réelle',C:'Temps de réponse réel',D:'Débit réseau réel'},answer:['A'],exp:'La maintenabilité peut être évaluée statiquement.'},
{tag:'K2 - outil',q:'25. Parmi les outils suivants, lesquels correspondent à l’analyse statique au sens large ?',type:'multi',options:{A:'Analyseur de code détectant variables non déclarées',B:'Vérificateur d’orthographe sur une spécification',C:'Outil de lisibilité de document',D:'Outil exécutant un scénario Selenium dans un navigateur'},answer:['A','B','C'],exp:'Selenium exécute le logiciel, donc c’est dynamique.'},
{tag:'K2 - couverture base de test',q:'26. Lors d’une revue des cas de test, on remarque qu’aucun test ne couvre un critère d’acceptation critique. Quel défaut est concerné ?',type:'single',options:{A:'Défaut de couverture de la base de test',B:'Défaut de performance',C:'Défaillance en production',D:'Défaut uniquement détectable par test dynamique'},answer:['A'],exp:'Un critère d’acceptation sans test est une lacune de couverture.'},
{tag:'K2 - validation/vérification',q:'27. Le test statique peut être utilisé pour la validation parce qu’il peut aider à vérifier que :',type:'single',options:{A:'Le code compile toujours',B:'Les exigences décrivent les besoins réels des parties prenantes',C:'Le serveur tient 10 000 utilisateurs simultanés',D:'Tous les tests automatisés passent'},answer:['B'],exp:'La validation concerne l’adéquation aux besoins réels.'},
{tag:'K2 - piège',q:'28. Laquelle des affirmations est fausse ?',type:'single',options:{A:'Le test statique peut détecter des défauts dans des produits non exécutables',B:'Le test dynamique nécessite un produit exécutable',C:'Le test statique et dynamique sont complémentaires',D:'Le test statique détecte toujours tous les défauts avant le test dynamique'},answer:['D'],exp:'Aucune technique ne détecte tous les défauts.'},
{tag:'Cas réel',q:'29. Pendant l’affinage du backlog, un testeur demande : « Que se passe-t-il si le client paie avec une carte expirée ? ». Quelle est la meilleure interprétation ?',type:'single',options:{A:'Le testeur perturbe le développement',B:'Le testeur contribue au test statique en clarifiant les règles et exemples',C:'Le testeur exécute un test dynamique',D:'La question doit attendre la production'},answer:['B'],exp:'Les bonnes questions améliorent les User Stories et critères d’acceptation.'},
{tag:'K2 - revue formelle',q:'30. Plus une revue est formelle, plus on s’attend généralement à :',type:'single',options:{A:'Moins de rôles, aucune préparation, aucun rapport',B:'Plus de tâches définies, responsabilités explicites et documentation',C:'Uniquement une discussion orale sans trace',D:'Aucune activité de suivi'},answer:['B'],exp:'La formalité augmente la structure, les rôles et la documentation.'},
{tag:'K1 - processus',q:'31. Quelle activité définit le périmètre, l’objectif, les critères de sortie, l’effort et les délais de la revue ?',type:'single',options:{A:'Planification',B:'Lancement',C:'Correction et rapport',D:'Communication et analyse'},answer:['A'],exp:'Ces éléments sont définis lors de la planification.'},
{tag:'K1 - processus',q:'32. Quelle activité vise à s’assurer que les participants comprennent leur rôle et ont accès au produit à examiner ?',type:'single',options:{A:'Planification',B:'Lancement de la revue',C:'Revue individuelle',D:'Correction'},answer:['B'],exp:'Le lancement prépare les participants au démarrage effectif.'},
{tag:'K2 - anomalie vs défaut',q:'33. Dans une revue, pourquoi les anomalies doivent-elles être analysées ?',type:'single',options:{A:'Parce qu’une anomalie identifiée n’est pas nécessairement un défaut',B:'Parce qu’une anomalie est toujours une défaillance',C:'Parce qu’une anomalie doit toujours être rejetée',D:'Parce qu’une anomalie ne peut jamais devenir un rapport de défaut'},answer:['A'],exp:'Une anomalie peut être un vrai défaut, une question ou une incompréhension.'},
{tag:'Cas réel',q:'34. Une inspection trouve de nombreuses anomalies et collecte le taux d’anomalies par page. À quoi ces métriques peuvent-elles servir ?',type:'single',options:{A:'À améliorer le processus de développement et d’inspection',B:'À sanctionner automatiquement l’auteur',C:'À supprimer les tests dynamiques',D:'À garantir zéro défaut'},answer:['A'],exp:'Les métriques d’inspection servent à l’amélioration du processus.'},
{tag:'K2 - sélection revue',q:'35. Le choix du type de revue dépend notamment de :',type:'multi',options:{A:'Objectifs de revue',B:'Risques',C:'Criticité et complexité du produit',D:'Culture de l’entreprise'},answer:['A','B','C','D'],exp:'Tous ces facteurs influencent le type de revue.'},
{tag:'Cas réel',q:'36. Un document d’architecture critique pour un système réglementé doit être examiné. L’objectif est de maximiser la détection d’anomalies, documenter les résultats et collecter des métriques. Quel type de revue choisir ?',type:'single',options:{A:'Revue informelle',B:'Inspection',C:'Simple relecture personnelle',D:'Test exploratoire'},answer:['B'],exp:'Les objectifs correspondent à une inspection.'},
{tag:'K2 - statique/dynamique',q:'37. Quel couple est correctement associé ?',type:'single',options:{A:'Maintenabilité — plutôt dynamique uniquement',B:'Efficacité de performance — dépend de l’exécution',C:'Code inaccessible — uniquement dynamique',D:'Contrat — uniquement test dynamique'},answer:['B'],exp:'La performance dépend généralement de l’exécution.'},
{tag:'Cas réel',q:'38. Une équipe examine une interface API et trouve que l’ordre des paramètres décrit dans la documentation ne correspond pas à l’implémentation attendue. Quel défaut typique est-ce ?',type:'single',options:{A:'Spécification d’interface incorrecte',B:'Défaut de performance',C:'Défaillance utilisateur finale',D:'Défaut de réseau'},answer:['A'],exp:'Nombre, type ou ordre des paramètres non concordants = défaut d’interface.'},
{tag:'K2 - standards',q:'39. Une analyse statique signale que le code ne respecte pas les conventions de nommage du standard de codage. Quelle affirmation est correcte ?',type:'single',options:{A:'Ce n’est jamais un défaut',B:'C’est un écart par rapport aux standards détectable statiquement',C:'Cela ne peut être vu qu’en production',D:'Cela prouve une défaillance fonctionnelle'},answer:['B'],exp:'Les écarts aux standards font partie des défauts détectables statiquement.'},
{tag:'K2 - synthèse',q:'40. Quelle stratégie est la plus cohérente avec l’ISTQB ?',type:'single',options:{A:'Utiliser uniquement le test dynamique car il montre les défaillances réelles',B:'Utiliser uniquement le test statique car il est précoce',C:'Combiner test statique et test dynamique car ils se complètent',D:'Éviter les revues car elles coûtent toujours plus cher que les corrections tardives'},answer:['C'],exp:'Les deux approches sont complémentaires.'}
];

const form=document.getElementById('quizForm');
questions.forEach((item,index)=>{
  const div=document.createElement('div'); div.className='card';
  let html=`<div class="tag">${item.tag}</div><div class="question-title">${item.q} ${item.type==='multi'?'<em>(plusieurs réponses possibles)</em>':''}</div>`;
  for(const [key,val] of Object.entries(item.options)){
    const t=item.type==='multi'?'checkbox':'radio';
    html+=`<label><input type="${t}" name="q${index}" value="${key}"> ${key}. ${val}</label>`;
  }
  html+=`<div id="corr${index}" class="correction"></div>`;
  div.innerHTML=html; form.appendChild(div);
});
function getSelected(i){return Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)).map(x=>x.value).sort();}
function same(a,b){return a.length===b.length && a.every((v,i)=>v===b[i]);}
function corriger(){
  clearInterval(timerInterval);
  let score=0;
  questions.forEach((q,i)=>{
    const sel=getSelected(i); const exp=[...q.answer].sort(); const ok=same(sel,exp); if(ok)score++;
    const c=document.getElementById(`corr${i}`); c.style.display='block'; c.className=`correction ${ok?'correct':'wrong'}`;
    c.innerHTML=`<strong>${ok?'✅ Correct':'❌ Incorrect'}</strong><br>Ta réponse : ${sel.length?sel.join(', '):'aucune'}<br>Bonne réponse : ${exp.join(', ')}<br>Explication : ${q.exp}`;
  });
  const pct=Math.round(score/questions.length*100); const res=document.getElementById('result');
  res.style.display='block'; res.className=`result ${pct>=65?'pass':'fail'}`;
  res.innerHTML=`Score : ${score}/${questions.length} — ${pct}%<br>${pct>=65?'✅ Réussi selon le seuil ISTQB':'❌ Non réussi selon le seuil ISTQB'}`;
  document.querySelectorAll('input').forEach(i=>i.disabled=true);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
