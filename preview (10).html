<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB Chapitre 1 - Examen Blanc</title>
<style>
:root {
  --bg:#eef2f7; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --blue:#2563eb;
  --blue2:#1d4ed8; --green:#16a34a; --red:#dc2626; --orange:#f59e0b; --border:#dbe3ef;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text);
}
.header {
  background:#1e293b; color:white; padding:18px 24px; box-shadow:0 2px 10px rgba(0,0,0,.18);
  position:sticky; top:0; z-index:99;
}
.header-inner { max-width:980px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:14px; }
h1 { margin:0; font-size:24px; }
.timer { font-size:24px; font-weight:bold; color:#facc15; background:#0f172a; padding:10px 16px; border-radius:10px; min-width:110px; text-align:center; }
.container { max-width:980px; margin:24px auto; padding:0 18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 24px rgba(15,23,42,.08); padding:24px; }
.meta { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.badge { background:#dbeafe; color:#1e40af; padding:7px 10px; border-radius:999px; font-size:13px; font-weight:bold; }
.progress-wrap { background:#e5e7eb; height:12px; border-radius:999px; overflow:hidden; margin:14px 0 22px; }
.progress { height:100%; background:var(--blue); width:0%; transition:.25s; }
.qtop { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; color:var(--muted); }
.qtype { font-weight:bold; color:#475569; }
.question-title { font-size:20px; font-weight:bold; margin:16px 0 20px; line-height:1.45; }
.option { display:flex; gap:12px; align-items:flex-start; padding:14px; margin:11px 0; border:2px solid #e5e7eb; border-radius:12px; cursor:pointer; background:#f9fafb; transition:.15s; }
.option:hover { border-color:#93c5fd; background:#eff6ff; }
.option input { margin-top:2px; transform:scale(1.2); }
.option.selected { border-color:var(--blue); background:#eff6ff; }
.nav { display:flex; justify-content:space-between; gap:12px; margin-top:24px; }
button { border:0; border-radius:10px; padding:13px 18px; font-weight:bold; font-size:15px; cursor:pointer; }
button:disabled { opacity:.45; cursor:not-allowed; }
.prev { background:#e5e7eb; color:#374151; }
.next { background:var(--blue); color:white; }
.next:hover { background:var(--blue2); }
.submit { background:var(--green); color:white; }
.grid { display:grid; grid-template-columns:repeat(10,1fr); gap:8px; margin-top:18px; }
.jump { padding:9px 0; border-radius:8px; background:#e5e7eb; color:#374151; font-size:13px; }
.jump.current { background:var(--blue); color:white; }
.jump.answered { background:#bbf7d0; color:#166534; }
.result { display:none; }
.score { font-size:48px; font-weight:900; margin:10px 0; }
.pass { color:var(--green); } .fail { color:var(--red); }
.review { border-left:5px solid #94a3b8; background:#f8fafc; padding:14px; border-radius:10px; margin:12px 0; }
.review.ok { border-left-color:var(--green); }
.review.ko { border-left-color:var(--red); }
.small { color:var(--muted); font-size:14px; }
.warning { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:12px; border-radius:12px; margin:12px 0; }
@media(max-width:700px) {
  .header-inner { flex-direction:column; align-items:flex-start; }
  .grid { grid-template-columns:repeat(5,1fr); }
  .nav { flex-direction:column; }
}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div>
      <h1>ISTQB Fondation v4.0 — Chapitre 1</h1>
      <div class="small" style="color:#cbd5e1">Mode examen : 40 questions difficiles, cas réels, pièges ISTQB</div>
    </div>
    <div class="timer" id="timer">30:00</div>
  </div>
</div>

<div class="container">
  <div id="exam" class="card">
    <div class="meta">
      <span class="badge">40 questions</span>
      <span class="badge">30 minutes</span>
      <span class="badge">Seuil 65%</span>
      <span class="badge">Score sur 100%</span>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="qtop">
      <span id="qcount"></span>
      <span class="qtype" id="qtype"></span>
    </div>
    <div class="question-title" id="question"></div>
    <div id="options"></div>
    <div class="nav">
      <button class="prev" id="prevBtn" onclick="prevQuestion()">← Précédent</button>
      <button class="next" id="nextBtn" onclick="nextQuestion()">Suivant →</button>
      <button class="submit" id="submitBtn" onclick="submitExam()" style="display:none">Valider l’examen</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="result" class="card result"></div>
</div>

<script>
const questions = [{"q": "Dans une application de paiement, les tests montrent que le paiement par carte respecte toutes les exigences écrites. Pourtant, les utilisateurs abandonnent car le parcours demande trop d’étapes. Quelle conclusion ISTQB est la plus correcte ?", "type": "single", "opts": ["La vérification est suffisante si toutes les exigences passent", "La validation peut être insuffisante même si la vérification est correcte", "Le débogage aurait dû résoudre le problème", "Le test exhaustif aurait empêché cette situation"], "ans": [1], "exp": "La vérification contrôle la conformité aux exigences spécifiées. La validation vérifie l’adéquation aux besoins réels."}, {"q": "Une équipe dit : « Aucun test n’a échoué, donc le système ne contient aucun défaut ». Quel principe est concerné ?", "type": "single", "opts": ["Le test montre la présence de défauts, pas leur absence", "Le regroupement des défauts", "L’usure des tests", "Le test dépend du contexte"], "ans": [0], "exp": "Le test réduit la probabilité de défauts non découverts, mais ne prouve jamais leur absence."}, {"q": "Dans un logiciel médical, une infirmière mal formée décrit mal une règle métier. L’exigence devient ambiguë, le code l’implémente mal, et le patient reçoit une alerte incorrecte. Quelle chaîne est correcte ?", "type": "single", "opts": ["Mauvaise formation = défaillance ; exigence ambiguë = erreur ; alerte incorrecte = défaut", "Mauvaise formation = cause racine possible ; mauvaise description = erreur ; exigence/code incorrect = défaut ; alerte incorrecte = défaillance", "Code incorrect = cause racine ; alerte incorrecte = erreur", "Tout est une défaillance"], "ans": [1], "exp": "Cause racine → erreur humaine → défaut dans un artefact → défaillance observée."}, {"q": "Quels objectifs sont des objectifs habituels du test ?", "type": "multi", "opts": ["Provoquer des défaillances et trouver des défauts", "Fournir des informations aux parties prenantes", "Prouver que le logiciel est sans défaut", "Réduire le niveau de risque d’une qualité insuffisante"], "ans": [0, 1, 3], "exp": "Le test vise notamment à trouver des défauts, informer et réduire le risque. Il ne prouve pas l’absence de défauts."}, {"q": "Lors d’un test dynamique, une application plante. Le développeur reproduit le problème, localise une condition fautive puis la corrige. Quelle partie correspond au débogage ?", "type": "single", "opts": ["L’exécution initiale du test", "La reproduction, le diagnostic et la correction de la cause", "La création du cas de test", "La clôture des tests"], "ans": [1], "exp": "Le débogage comprend reproduction, diagnostic et correction de la cause."}, {"q": "Une revue d’exigences détecte une contradiction avant le codage. Quel énoncé est exact ?", "type": "single", "opts": ["Ce n’est pas du test car aucun logiciel n’est exécuté", "C’est du test statique qui détecte directement un défaut", "C’est du débogage dynamique", "C’est une défaillance"], "ans": [1], "exp": "Le test statique n’exécute pas le logiciel et peut identifier directement des défauts."}, {"q": "Quelle affirmation différencie correctement test et assurance qualité ?", "type": "single", "opts": ["Le test est préventif et orienté processus ; l’assurance qualité est corrective", "Le test est une forme de contrôle qualité orientée produit ; l’assurance qualité est préventive et orientée processus", "Le test et l’assurance qualité sont synonymes", "L’assurance qualité consiste à exécuter les tests"], "ans": [1], "exp": "Le test est une activité de contrôle qualité. L’assurance qualité améliore les processus."}, {"q": "Un défaut dans une exigence est trouvé en début de projet. Pourquoi est-ce important selon ISTQB ?", "type": "single", "opts": ["Parce que les défauts précoces ne se propagent jamais", "Parce que corriger tôt peut éviter des défauts dérivés et réduire les coûts", "Parce que cela supprime le besoin de test dynamique", "Parce que cela prouve la qualité finale"], "ans": [1], "exp": "Tester tôt économise temps et argent en évitant la propagation des défauts."}, {"q": "Une suite de tests répétée sans changement depuis longtemps détecte peu de nouveaux défauts. Quelle action est la plus conforme ?", "type": "single", "opts": ["Arrêter les tests", "Modifier/compléter les tests et données, tout en conservant les régressions utiles", "Conclure que le logiciel est correct", "Réduire la traçabilité"], "ans": [1], "exp": "L’usure des tests impose de faire évoluer les tests, mais les tests de régression répétés peuvent rester utiles."}, {"q": "80% des défauts d’un site de réservation apparaissent dans le module de tarification dynamique. Quelle décision est la plus cohérente ?", "type": "single", "opts": ["Réduire l’effort sur ce module puisqu’il est connu", "Augmenter l’effort de test sur ce module à risque", "Tester uniquement la page d’accueil", "Arrêter les tests des autres modules"], "ans": [1], "exp": "Le regroupement des défauts montre que peu de composants concentrent souvent beaucoup de défauts."}, {"q": "Quels exemples montrent la nécessité du test ?", "type": "multi", "opts": ["Réduire le risque de perte financière ou de réputation", "Évaluer directement la qualité à différents stades", "Remplacer complètement les utilisateurs finaux", "Satisfaire des exigences réglementaires ou contractuelles"], "ans": [0, 1, 3], "exp": "Le test contribue à la qualité, au risque, aux décisions et parfois à la conformité."}, {"q": "Quelle activité répond principalement à la question : « Que tester ? »", "type": "single", "opts": ["Analyse de test", "Conception des tests", "Implémentation des tests", "Exécution des tests"], "ans": [0], "exp": "L’analyse de test identifie les caractéristiques testables et conditions de test."}, {"q": "Quelle activité répond principalement à la question : « Comment tester ? »", "type": "single", "opts": ["Analyse de test", "Conception des tests", "Clôture des tests", "Pilotage des tests"], "ans": [1], "exp": "La conception transforme les conditions en cas de test et autres éléments."}, {"q": "Une équipe prépare les scripts automatisés, les données de test, les suites et l’ordre d’exécution. Quelle activité domine ?", "type": "single", "opts": ["Planification", "Analyse", "Implémentation des tests", "Clôture"], "ans": [2], "exp": "L’implémentation crée/acquiert le testware nécessaire à l’exécution."}, {"q": "Pendant l’exécution, le résultat réel diffère du résultat attendu. Quelle suite est correcte ?", "type": "single", "opts": ["Corriger immédiatement le code", "Enregistrer le résultat, analyser l’anomalie et signaler si nécessaire", "Supprimer le test", "Classer automatiquement le défaut comme critique"], "ans": [1], "exp": "L’exécution inclut comparaison attendu/réel, enregistrement et analyse des anomalies."}, {"q": "Quels éléments appartiennent typiquement au testware de planification ?", "type": "multi", "opts": ["Plan de test", "Calendrier des tests", "Référentiel des risques", "Logs de test"], "ans": [0, 1, 2], "exp": "Les logs sont produits pendant l’exécution, pas la planification."}, {"q": "Quels éléments appartiennent typiquement au testware de conception ?", "type": "multi", "opts": ["Cas de test priorisés", "Chartes de test", "Exigences en matière de données de test", "Rapport de clôture"], "ans": [0, 1, 2], "exp": "Le rapport de clôture appartient aux activités de clôture."}, {"q": "Quels éléments sont typiquement produits pendant l’exécution ?", "type": "multi", "opts": ["Logs de test", "Rapports de défaut", "Résultats de test", "Plan de test initial"], "ans": [0, 1, 2], "exp": "L’exécution produit logs, résultats et rapports de défaut."}, {"q": "La traçabilité entre résultats de test et risques aide surtout à :", "type": "single", "opts": ["Évaluer le risque résiduel", "Écrire du code plus vite", "Supprimer les cas de test", "Prouver l’absence de défauts"], "ans": [0], "exp": "La traçabilité résultats-risques soutient l’évaluation du risque résiduel."}, {"q": "La traçabilité des cas de test vers les exigences permet principalement de :", "type": "single", "opts": ["Vérifier que les exigences sont couvertes par des tests", "Corriger les défauts automatiquement", "Remplacer les critères de sortie", "Éviter les audits"], "ans": [0], "exp": "Elle soutient l’évaluation de la couverture."}, {"q": "Dans un projet Agile, certaines tâches du test manager peuvent être assumées par :", "type": "single", "opts": ["L’équipe Agile, selon le contexte", "Uniquement un test manager externe", "Uniquement le client", "Personne"], "ans": [0], "exp": "Le rôle varie selon le contexte ; certaines tâches peuvent être distribuées."}, {"q": "Le rôle de test manager est principalement centré sur :", "type": "single", "opts": ["Analyse, conception, implémentation et exécution technique", "Planification, pilotage, contrôle et clôture", "Correction du code", "Support utilisateur"], "ans": [1], "exp": "Le test manager porte la responsabilité globale du processus et du pilotage."}, {"q": "Le rôle de testeur est principalement centré sur :", "type": "single", "opts": ["Analyse, conception, implémentation et exécution des tests", "Budget global du projet", "Contrats fournisseurs", "Marketing produit"], "ans": [0], "exp": "Le testeur est centré sur les aspects techniques du test."}, {"q": "Dans une équipe intégrée, développeurs, testeurs et métier collaborent sur les tests d’acceptation. Quel avantage est illustré ?", "type": "single", "opts": ["Plus grande collaboration et partage des compétences", "Indépendance maximale obligatoire", "Suppression de toute activité de test", "Garantie de 100% de couverture"], "ans": [0], "exp": "L’approche intégrée améliore communication, collaboration et synergie."}, {"q": "Dans un système critique pour la sécurité, pourquoi l’approche équipe intégrée peut-elle ne pas suffire ?", "type": "single", "opts": ["Elle empêche toute communication", "Un niveau plus élevé d’indépendance du test peut être nécessaire", "Elle interdit les tests d’acceptation", "Elle supprime la traçabilité"], "ans": [1], "exp": "Les contextes critiques peuvent nécessiter plus d’indépendance."}, {"q": "Quel est un avantage de l’indépendance du test ?", "type": "single", "opts": ["Les testeurs ont exactement les mêmes biais que les auteurs", "Les testeurs peuvent identifier différents défauts et contester des hypothèses", "Les développeurs n’ont plus de responsabilité qualité", "Elle rend le test exhaustif possible"], "ans": [1], "exp": "L’indépendance apporte une perspective différente."}, {"q": "Quel est un inconvénient possible d’une forte indépendance ?", "type": "single", "opts": ["Isolement ou relation d’opposition avec l’équipe de développement", "Augmentation automatique de la collaboration", "Disparition des défauts", "Suppression du besoin de reporting"], "ans": [0], "exp": "Les testeurs indépendants peuvent être isolés ou vus comme un goulot."}, {"q": "Quel exemple illustre le principe « le test dépend du contexte » ?", "type": "single", "opts": ["Tester une application médicale, un jeu mobile et un site vitrine de la même façon", "Adapter stratégie, couverture et documentation selon criticité, risques et contraintes", "Répéter toujours les mêmes tests", "Éviter les techniques de test"], "ans": [1], "exp": "Le contexte influence l’approche, les techniques, la couverture, l’automatisation, etc."}, {"q": "Quels facteurs peuvent influencer le processus de test ?", "type": "multi", "opts": ["Parties prenantes et besoins métier", "Compétences et disponibilité de l’équipe", "Contraintes de temps, budget et ressources", "L’idée qu’une stratégie universelle suffit toujours"], "ans": [0, 1, 2], "exp": "Le processus de test est adapté selon les facteurs contextuels."}, {"q": "Un produit satisfait toutes les exigences mais ne permet pas au client d’atteindre ses objectifs métier. Quel principe est illustré ?", "type": "single", "opts": ["Illusion de l’absence de défaut", "Regroupement des défauts", "Usure des tests", "Test exhaustif impossible"], "ans": [0], "exp": "Corriger tous les défauts connus dans les exigences ne garantit pas le succès métier."}, {"q": "Dans quel cas parle-t-on le plus directement de validation ?", "type": "single", "opts": ["Le système respecte l’exigence REQ-08", "Le système répond aux besoins réels dans son environnement opérationnel", "Le code suit les standards internes", "Chaque exigence a un cas de test"], "ans": [1], "exp": "La validation vérifie l’adéquation aux besoins des utilisateurs."}, {"q": "Dans quel cas parle-t-on le plus directement de vérification ?", "type": "single", "opts": ["Le produit est-il utile pour les utilisateurs ?", "Le système est-il conforme aux exigences spécifiées ?", "Le client aime-t-il le produit ?", "Le produit est-il meilleur que les concurrents ?"], "ans": [1], "exp": "La vérification contrôle la conformité à ce qui est spécifié."}, {"q": "Un défaut est trouvé dans un document de conception lors d’une revue. Que faut-il généralement faire pour le débogage ?", "type": "single", "opts": ["Reproduire une défaillance en production", "Éliminer le défaut sans reproduction obligatoire", "Exécuter tous les tests système", "Créer un simulateur"], "ans": [1], "exp": "En test statique, le défaut est constaté directement ; pas besoin de provoquer une défaillance."}, {"q": "Quels éléments appartiennent aux activités de clôture des tests ?", "type": "multi", "opts": ["Archiver ou transmettre le testware utile", "Analyser les leçons apprises", "Créer un rapport d’achèvement des tests", "Définir pour la première fois les conditions de test"], "ans": [0, 1, 2], "exp": "Les conditions de test relèvent de l’analyse, pas de la clôture."}, {"q": "Quel exemple correspond au pilotage et contrôle des tests ?", "type": "single", "opts": ["Comparer l’avancement réel au plan puis ajuster l’effort pour atteindre les objectifs", "Créer une exigence métier", "Corriger une ligne de code", "Remplacer les tests par des revues"], "ans": [0], "exp": "Le pilotage suit l’avancement ; le contrôle prend des mesures correctives."}, {"q": "Quelles compétences sont importantes pour un testeur ?", "type": "multi", "opts": ["Pensée critique et analytique", "Communication constructive", "Connaissance du domaine", "Tendance à blâmer l’auteur du défaut"], "ans": [0, 1, 2], "exp": "La communication constructive est essentielle car le test peut être perçu comme critique."}, {"q": "Un testeur écrit dans un rapport : « Le développeur n’a rien compris ». Quelle compétence manque le plus ?", "type": "single", "opts": ["Communication constructive", "Automatisation uniquement", "Indépendance externe", "Connaissance du matériel"], "ans": [0], "exp": "Les informations sur défauts et défaillances doivent être communiquées de manière constructive."}, {"q": "Quel énoncé sur les défauts est exact ?", "type": "single", "opts": ["Les défauts ne peuvent exister que dans le code", "Les défauts peuvent exister dans les exigences, scripts de test, code ou fichiers de build", "Un défaut exécuté provoque toujours une défaillance", "Une défaillance est toujours causée par une erreur humaine"], "ans": [1], "exp": "Les défauts peuvent se trouver dans divers artefacts, pas seulement dans le code."}, {"q": "Les défaillances peuvent être causées par :", "type": "multi", "opts": ["Des défauts exécutés", "Des conditions environnementales", "Des radiations ou champs électromagnétiques dans certains contextes", "Uniquement des erreurs humaines"], "ans": [0, 1, 2], "exp": "Les défaillances ne viennent pas uniquement d’erreurs ou défauts humains."}, {"q": "Quel énoncé décrit le mieux la cause racine ?", "type": "single", "opts": ["La défaillance visible par l’utilisateur", "Une raison fondamentale à l’apparition du problème", "Un cas de test qui échoue", "La correction du défaut"], "ans": [1], "exp": "La cause racine est la raison fondamentale qui conduit à un problème."}];
let current = 0;
let answers = Array.from({length: questions.length}, () => []);
let remaining = 30 * 60;
let submitted = false;

function sameArray(a,b) {
  a = [...a].sort((x,y)=>x-y); b = [...b].sort((x,y)=>x-y);
  return a.length === b.length && a.every((v,i)=>v===b[i]);
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qcount').textContent = `Question ${current+1} / ${questions.length}`;
  document.getElementById('qtype').textContent = q.type === 'multi' ? 'Plusieurs réponses possibles' : 'Une seule réponse';
  document.getElementById('question').textContent = q.q;
  document.getElementById('progress').style.width = `${((current+1)/questions.length)*100}%`;
  const options = document.getElementById('options');
  options.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const selected = answers[current].includes(i);
    const label = document.createElement('label');
    label.className = 'option' + (selected ? ' selected' : '');
    const type = q.type === 'multi' ? 'checkbox' : 'radio';
    label.innerHTML = `<input type="${type}" name="q" value="${i}" ${selected?'checked':''}> <span><b>${String.fromCharCode(65+i)}.</b> ${opt}</span>`;
    label.onclick = () => selectAnswer(i);
    options.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').style.display = current === questions.length - 1 ? 'none' : 'inline-block';
  document.getElementById('submitBtn').style.display = current === questions.length - 1 ? 'inline-block' : 'none';
  renderGrid();
}

function selectAnswer(i) {
  const q = questions[current];
  if (q.type === 'single') answers[current] = [i];
  else {
    if (answers[current].includes(i)) answers[current] = answers[current].filter(x => x !== i);
    else answers[current].push(i);
  }
  renderQuestion();
}

function nextQuestion() { if (current < questions.length - 1) { current++; renderQuestion(); } }
function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }
function goTo(i) { current = i; renderQuestion(); }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'jump' + (i === current ? ' current' : '') + (answers[i].length ? ' answered' : '');
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}

function tick() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (remaining <= 0) submitExam();
  remaining--;
}

function submitExam() {
  if (submitted) return;
  submitted = true;
  clearInterval(clock);
  let score = 0, answered = 0, review = '';
  questions.forEach((q, i) => {
    const ok = sameArray(answers[i], q.ans);
    if (answers[i].length) answered++;
    if (ok) score++;
    const your = answers[i].length ? answers[i].sort((a,b)=>a-b).map(n => `${String.fromCharCode(65+n)}. ${q.opts[n]}`).join('<br>') : '<i>Aucune réponse</i>';
    const good = q.ans.sort((a,b)=>a-b).map(n => `${String.fromCharCode(65+n)}. ${q.opts[n]}`).join('<br>');
    review += `<div class="review ${ok?'ok':'ko'}">
      <b>Q${i+1} — ${ok?'✅ Correct':'❌ Incorrect'}</b><br>
      <span class="small">Ta réponse :</span><br>${your}<br>
      <span class="small">Bonne réponse :</span><br>${good}<br>
      <span class="small">Explication :</span> ${q.exp}
    </div>`;
  });
  const percent = Math.round((score / questions.length) * 100);
  const passed = percent >= 65;
  document.getElementById('exam').style.display = 'none';
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <h2>Résultat final</h2>
    <div class="score ${passed?'pass':'fail'}">${percent}%</div>
    <h3>${passed?'✅ Réussi':'❌ Échec'} — ${score} / 40</h3>
    <p>Questions répondues : ${answered} / 40. Seuil de réussite : 65%.</p>
    ${answered < 40 ? '<div class="warning">Attention : certaines questions n’ont pas été répondues.</div>' : ''}
    <button class="next" onclick="location.reload()">Recommencer</button>
    <h3>Correction détaillée</h3>
    ${review}
  `;
  window.scrollTo({top:0, behavior:'smooth'});
}

renderQuestion();
tick();
const clock = setInterval(tick, 1000);
</script>
</body>
</html>
